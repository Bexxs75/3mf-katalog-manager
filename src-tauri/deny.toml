# cargo-deny configuration.
#
# The focus is deliberately on "advisories" (real security vulnerabilities and
# yanked crates) - that's the part running automatically in security-audit.yml.
# "licenses", "bans" and "sources" are deliberately kept minimal/permissive (see
# below) and don't contain a fully curated license allow list.

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Real security advisories and yanked crates should break the build
# (cargo deny check advisories). An ignore must stay rare and carry its reason:
# a red audit has to mean "look at this", so an entry that cargo-deny reports
# as "advisory-not-detected" (the crate left the tree or was fixed) is removed
# instead of being kept as history.
yanked = "deny"
ignore = [
    # chrono is reported as unmaintained (no known vulnerability). It is a direct dependency
    # of katalog-core, katalog-server and the desktop app (about 115 uses in 47 files), so a
    # move to jiff or time is a separate task. Review by 2027-03-31: replace chrono or renew
    # this entry with a fresh reason; remove it as soon as chrono leaves the tree.
    # (The zip 4.x entries RUSTSEC-2026-0545/0548 are gone: tauri-plugin-updater 2.14.1 uses zip 9.)
    { id = "RUSTSEC-2026-0543", reason = "chrono reported as unmaintained, no known vulnerability; direct dependency for date formatting, replacement planned separately" },
]

[licenses]
# Deliberately not a carefully curated license policy: the list below is simply
# every SPDX identifier appearing in the current dependency tree output of
# `cargo deny check licenses` (including LGPL-2.1 of opencascade-sys/OCCT - see
# THIRD-PARTY-LICENSES.md, dynamically linked, a deliberate project decision). A
# properly reviewed license allow list is a separate task; this list only keeps
# today's state green.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[bans]
# Multiple versions of the same crate (e.g. from different transitive
# dependencies of Tauri plugins) are normal in this repo and not an error.
multiple-versions = "allow"
wildcards = "allow"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
