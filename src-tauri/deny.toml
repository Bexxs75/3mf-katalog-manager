# cargo-deny configuration.
#
# The focus is deliberately on "advisories" (real security vulnerabilities and
# yanked crates) - that's the part running automatically in security-audit.yml.
# "licenses", "bans" and "sources" are deliberately kept minimal/permissive (see
# below) and don't contain a fully curated license allow list.

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Real security advisories and yanked crates should break the build
# (cargo deny check advisories). An ignore must stay rare and carry its reason:
# a red audit has to mean "look at this", so an entry that cargo-deny reports
# as "advisory-not-detected" (the crate left the tree or was fixed) is removed
# instead of being kept as history.
yanked = "deny"
ignore = [
    # zip 4.6.1 (via tauri-plugin-updater): ZipArchive::extract / ZipStreamReader::extract
    # keep SUID/SGID bits and follow symlinks (fixed in zip >= 9). Not reachable from our
    # code: it never calls extract(), it only reads and writes archives with
    # ZipArchive::new / ZipWriter and unpacks user archives with its own code
    # (archive/extract.rs). The plugin extracts only update packages whose signature was
    # verified first. Remove these entries when the plugin moves to zip >= 9.
    { id = "RUSTSEC-2026-0367", reason = "zip 4.6.1 extract(): SUID/SGID and symlinks; extract() is never called by us, updater verifies the signature first" },
    { id = "RUSTSEC-2026-0368", reason = "zip 4.6.1 extract() family; same reasoning as RUSTSEC-2026-0367" },
    { id = "RUSTSEC-2026-0369", reason = "zip 4.6.1 extract() family; same reasoning as RUSTSEC-2026-0367" },
    # Symlink entry with a large declared size aborts extract().
    { id = "RUSTSEC-2026-0429", reason = "zip 4.6.1 extract() aborts on a symlink entry with a large size; only signature-verified update packages are extracted" },
    # Two more zip 4.6.1 advisories, again only via tauri-plugin-updater (no safe upgrade, the
    # plugin pins zip 4). RUSTSEC-2026-0545 (AES entries returned without checking the
    # authentication code) needs zip's "aes-crypto" feature, which this build does not enable.
    # RUSTSEC-2026-0548 (ZipStreamReader trusts local-header names) affects ZipStreamReader
    # only; the plugin uses ZipArchive::extract on signature-verified update packages, and our
    # own code is on zip 9 and uses neither ZipStreamReader nor decryption.
    { id = "RUSTSEC-2026-0545", reason = "zip 4.6.1 AES entries without authentication check; needs the aes-crypto feature, which this build does not enable" },
    { id = "RUSTSEC-2026-0548", reason = "zip 4.6.1 ZipStreamReader trusts local-header names; only ZipArchive::extract on signature-verified update packages is used" },
    # chrono is reported as unmaintained (no known vulnerability). It is a direct dependency
    # for date formatting; moving to jiff or time is planned separately.
    { id = "RUSTSEC-2026-0543", reason = "chrono reported as unmaintained, no known vulnerability; direct dependency for date formatting, replacement planned separately" },
]

[licenses]
# Deliberately not a carefully curated license policy: the list below is simply
# every SPDX identifier appearing in the current dependency tree output of
# `cargo deny check licenses` (including LGPL-2.1 of opencascade-sys/OCCT - see
# THIRD-PARTY-LICENSES.md, dynamically linked, a deliberate project decision). A
# properly reviewed license allow list is a separate task; this list only keeps
# today's state green.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[bans]
# Multiple versions of the same crate (e.g. from different transitive
# dependencies of Tauri plugins) are normal in this repo and not an error.
multiple-versions = "allow"
wildcards = "allow"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
