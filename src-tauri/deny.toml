# cargo-deny configuration.
#
# The focus is deliberately on "advisories" (real security vulnerabilities and
# yanked crates) - that's the part running automatically in security-audit.yml.
# "licenses", "bans" and "sources" are deliberately kept minimal/permissive (see
# below) and don't contain a fully curated license allow list.

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Real security advisories and yanked crates should break the build
# (cargo deny check advisories). "unmaintained"/"unsound" reports are not
# silenced globally but listed individually under "ignore" with a reason - they
# all come from Tauri's GTK3 stack (Linux backend) or its dependencies and are
# transitive, so a `cargo update` in this repo can't fix them.
yanked = "deny"
ignore = [
    # proc-macro-error is unmaintained; comes in transitively via glib-macros ->
    # glib -> atk -> gtk -> muda -> tauri (Linux window menu internals).
    "RUSTSEC-2024-0370",
    # unic-char-property is unmaintained; comes in transitively via
    # unic-ucd-ident -> urlpattern -> tauri-utils -> tauri.
    "RUSTSEC-2025-0081",
    # unic-char-range is unmaintained; same dependency chain as above.
    "RUSTSEC-2025-0075",
    # unic-common is unmaintained; same dependency chain as above.
    "RUSTSEC-2025-0080",
    # unic-ucd-ident is unmaintained; comes in transitively via urlpattern -> tauri-utils -> tauri.
    "RUSTSEC-2025-0100",
    # unic-ucd-version is unmaintained; same dependency chain as above.
    "RUSTSEC-2025-0098",
]

[licenses]
# Deliberately not a carefully curated license policy: the list below is simply
# every SPDX identifier appearing in the current dependency tree output of
# `cargo deny check licenses` (including LGPL-2.1 of opencascade-sys/OCCT - see
# THIRD-PARTY-LICENSES.md, dynamically linked, a deliberate project decision). A
# properly reviewed license allow list is a separate task; this list only keeps
# today's state green.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[bans]
# Multiple versions of the same crate (e.g. from different transitive
# dependencies of Tauri plugins) are normal in this repo and not an error.
multiple-versions = "allow"
wildcards = "allow"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
