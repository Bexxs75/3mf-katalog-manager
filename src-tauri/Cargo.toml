[package]
name = "mf-katalog-manager"
version = "0.13.1"
description = "A Tauri App"
authors = ["Bexxs75"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mf_katalog_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Einziges Default-Feature. Der Build OHNE STEP-Vorschau entsteht mit
# `--no-default-features`; er braucht dann weder OCCT noch cmake und enthaelt
# keinen LGPL-Anteil (kommerzieller Build, siehe THIRD-PARTY-LICENSES.md).
# WICHTIG: Das muss das einzige Default-Feature bleiben - kaeme ein zweites
# dazu, wuerde `--no-default-features` dieses mit abschalten.
default = ["step-preview"]
step-preview = ["dep:cxx", "dep:opencascade-sys"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
# Archive beim Import entpacken (siehe src/archive/). Bewusst reine
# Rust-Dekoder fuer xz/zstd (lzma-rust2, ruzstd), damit keine weiteren
# C-Bibliotheken in die drei Plattform-Builds kommen.
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "xz", "optimization"] }
ruzstd = "0.9"
# 7z: reines Rust. Ohne "aes256" - verschluesselte 7z werden nur erkannt
# (AES-Coder im Block), nicht entpackt.
sevenz-rust2 = { version = "0.23", default-features = false, features = ["bzip2", "ppmd", "util"] }
# RAR: bindet den offiziellen UnRAR-Quellcode (C++) ein. Lizenz siehe
# THIRD-PARTY-LICENSES.md (Freeware, keine OSI-Lizenz).
unrar = "0.5"
quick-xml = "0.41"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "trace"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
sha2 = "0.10"
cxx = { version = "1", optional = true }
# STEP-Vorschau (Version 2): rohe OCCT-Bindings. Bewusst OHNE das Feature
# `builtin` - das wuerde OCCT aus dem Quelltext bauen und STATISCH linken, was
# die LGPL-Pflicht ausloest (relinkbare Objektdateien an jeden Empfaenger).
# Dynamisch gelinkt bleibt OCCT austauschbar; siehe THIRD-PARTY-LICENSES.md.
opencascade-sys = { version = "0.3", optional = true }

# Nur macOS: Quarantaene-Attribut des Archivs auf entpackte Dateien
# uebertragen (siehe src/archive/origin.rs).
[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1"

[dev-dependencies]
# Nur fuer Tests: xz-Archive erzeugen.
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "xz", "optimization", "encoder"] }
# Nur fuer Tests: 7z-Archive (auch verschluesselte) erzeugen.
sevenz-rust2 = { version = "0.23", default-features = false, features = ["bzip2", "ppmd", "util", "compress", "aes256"] }

# Der Patch ersetzt die crates.io-Fassung durch die geforkte Kopie in
# `vendor/opencascade-sys` - noetig, weil 0.3.0 gegen OCCT 7.9 nicht uebersetzt.
# Nur zwei Aenderungen gegenueber upstream (TopoDS-Namensraum, CMake-Mindest-
# version); Begruendung und Pflegehinweise stehen in
# `vendor/opencascade-sys/VENDORING.md`.
[patch.crates-io]
opencascade-sys = { path = "vendor/opencascade-sys" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
