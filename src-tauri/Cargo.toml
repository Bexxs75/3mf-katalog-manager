[package]
name = "mf-katalog-manager"
version = "0.17.0-8"
description = "A Tauri App"
authors = ["Bexxs75"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mf_katalog_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# The only default feature. The build WITHOUT the STEP preview uses
# `--no-default-features`; it then needs neither OCCT nor cmake and contains no
# LGPL part (commercial build, see THIRD-PARTY-LICENSES.md).
# IMPORTANT: this must stay the only default feature - a second one would be
# turned off by `--no-default-features` as well.
default = ["step-preview"]
step-preview = ["katalog-core/step-preview"]
# Test versions: own update channel (see tauri.preview.conf.json for the own identifier).
preview = []

[dependencies]
katalog-core = { path = "../crates/katalog-core", default-features = false }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
zip = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "trace"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
sha2 = "0.10"
log = "0.4"
tauri-plugin-log = "2.9"
# Same major as Tauri itself: resolves the log folder before the app exists.
dirs = "7"
tauri-plugin-updater = "2.13"
regex = "1"
unicode-normalization = "0.1.25"
# Startup header line: OS name/version next to the app version.
os_info = "3"
# Anonymizing the host name in a log export before it leaves the computer.
gethostname = "1"

[dev-dependencies]
katalog-core = { path = "../crates/katalog-core", default-features = false, features = ["test-support"] }
# Exercise command boundaries without a native window or global environment changes.
tauri = { version = "2", features = ["test"] }

# Unix test fixture: create a FIFO to exercise the core's non-blocking file open
# (see crates/katalog-core/src/safe_file.rs).
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
