[package]
name = "katalog-server"
version = "0.17.0"
edition = "2021"
license = "MIT"
description = "Read-only web server for the 3MF Katalog Manager catalog"

[dependencies]
katalog-core = { path = "../katalog-core", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }
tower-http = { version = "0.6", default-features = false, features = ["limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
argon2 = "0.5"
getrandom = "0.3"
base64 = "0.22"
log = "0.4"
rusqlite = { version = "0.40.2", features = ["hooks"] }
sha2 = "0.10"
unicode-normalization = "0.1.25"
chrono = { version = "0.4", default-features = false, features = ["std"] }

hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
katalog-core = { path = "../katalog-core", default-features = false, features = ["test-support"] }
http-body-util = "0.1"
zip = "9"
sevenz-rust2 = { version = "0.23", default-features = false, features = ["bzip2", "ppmd", "util", "compress", "aes256"] }
