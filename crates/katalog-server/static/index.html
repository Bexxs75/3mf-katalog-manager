<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Katalog – nur lesend</title><link rel="stylesheet" href="/static/app.css"><script src="/static/app.js" defer></script></head>
<body><main><header><h1>3MF Katalog</h1><p>Katalog nur lesend</p></header><p id="error" role="alert"></p><p id="notice" role="status">Sitzung wird geprüft …</p>
<section id="login-view" hidden><h2>Anmelden</h2><form id="login"><label for="password">Passwort</label><input id="password" type="password" autocomplete="current-password" required><button>Anmelden</button></form></section>
<section id="change-view" hidden><h2>Passwort ändern</h2><p>Bitte 12 bis 128 Zeichen verwenden.</p><form id="change"><label for="current">Aktuelles Passwort</label><input id="current" type="password" autocomplete="current-password" required><label for="new">Neues Passwort</label><input id="new" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><label for="repeat">Neues Passwort wiederholen</label><input id="repeat" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button>Passwort speichern</button><button id="cancel-change" type="button" hidden>Zurück</button></form></section>
<section id="catalog-view" hidden><nav aria-label="Sitzung"><button id="open-change">Passwort ändern</button><button id="logout">Abmelden</button></nav><h2>Modelle</h2><div class="table-scroll"><table><thead><tr><th>Name</th><th>Typ</th><th>Größe (Bytes)</th><th>Druckstatus</th></tr></thead><tbody id="models"></tbody></table></div><p id="empty" hidden>Keine Modelle vorhanden.</p></section>
</main></body></html>
