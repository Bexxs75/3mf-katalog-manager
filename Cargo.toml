[workspace]
members = ["src-tauri", "crates/katalog-core", "crates/katalog-server"]
resolver = "2"

# The patch replaces the crates.io version with the forked copy in
# `src-tauri/vendor/opencascade-sys` - needed because 0.3.0 doesn't compile against OCCT
# 7.9. Only two changes compared to upstream (TopoDS namespace, CMake minimum
# version); rationale and maintenance notes are in
# `src-tauri/vendor/opencascade-sys/VENDORING.md`.
[patch.crates-io]
drag = { path = "src-tauri/vendor/drag" }
opencascade-sys = { path = "src-tauri/vendor/opencascade-sys" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The bundled SQLite is C code; unoptimised it makes debug builds and the timing tests
# (e.g. the 5000-file tag repair) several times slower than what users run.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.test.package.libsqlite3-sys]
opt-level = 3
