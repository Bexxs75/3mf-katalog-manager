location = /katalog/upload {
    # Raise nginx's 1 MB default; stream directly without a temporary request-body file.
    client_max_body_size 4g;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # The service logs only method, fixed route and status, never client-supplied names.
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://127.0.0.1:8099;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $katalog_forwarded_proto;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_buffering off;
}

location /katalog/ {
    proxy_pass http://127.0.0.1:8099;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $katalog_forwarded_proto;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_buffering off;
}

location /katalog/signed/ {
    auth_basic off;
    # Signed paths are bearer credentials; nginx must not log them either.
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://127.0.0.1:8099;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $katalog_forwarded_proto;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_buffering off;
}
