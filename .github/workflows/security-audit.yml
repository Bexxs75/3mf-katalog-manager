name: Security audit (dependencies)

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}
  # Every change to a manifest or lockfile, on either side, and to the
  # workflows themselves - not only Cargo.lock.
  push:
    paths:
      - "package.json"
      - "package-lock.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/deny.toml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/deny.toml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: cargo-deny (Advisories)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories

  npm-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Hard gate: only what ships inside the app. Build tooling (Tailwind,
      # Vite, Vitest …) is checked below without failing the run, because
      # advisories there often have no patched release for weeks and would
      # otherwise hide real findings in the runtime dependencies.
      - name: npm audit, runtime dependencies (high/critical fails the run)
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit, all dependencies (report only)
        run: npm audit --audit-level=high || echo "::warning::npm audit found high/critical advisories in dev dependencies (see log); runtime dependencies are clean."
