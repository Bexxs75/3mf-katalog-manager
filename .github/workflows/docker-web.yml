name: Docker web image

# Builds the slim web image (katalog-server + web UI, docker-web/Dockerfile) and smoke-tests it.
# Manual and called runs build and test only; publishing needs publish=true explicitly.
# A published stable release (tag vX.Y.Z, no pre-release) publishes its web image on its own,
# like docker-image.yml does for the desktop image. release.yml calls this workflow with
# publish: false for the draft build, which must stay that way: the draft is not public yet.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      ref:
        description: "Branch or tag to build (empty: the ref that triggered the run)"
        required: false
        type: string
        default: ""
      version:
        description: "Version used for labels and tags, e.g. 0.18.0-1 (RC) or 0.18.0"
        required: false
        type: string
        default: ""
      publish:
        description: "Push the image to ghcr.io (off: build and test only)"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build (empty: the selected ref)"
        required: false
        type: string
        default: ""
      version:
        description: "Version used for labels and tags, e.g. 0.18.0-1 (RC) or 0.18.0"
        required: false
        type: string
        default: ""
      publish:
        description: "Push the image to ghcr.io (off: build and test only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Provisional name: the final image name is not decided yet.
  WEB_IMAGE_NAME: 3mf-katalog-manager-web

jobs:
  # Builds and tests with a read-only token. Third-party actions run only here, so a compromised
  # action cannot publish anything; the package-write token exists only in the publish job below.
  web-image:
    # A release event only counts for a published stable release; its tag is checked strictly below.
    if: >-
      github.event_name != 'release' ||
      (!github.event.release.draft && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      rc: ${{ steps.meta.outputs.rc }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      # The inputs are empty on a release event; the tag is both the ref to build and the version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name }}
          persist-credentials: false

      - name: Resolve metadata
        id: meta
        shell: bash
        env:
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          version=${VERSION#v}
          publish=$INPUT_PUBLISH
          if [[ "$EVENT_NAME" == release ]]; then
            # Only a stable vX.Y.Z is published automatically; the flag alone is not trusted.
            [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a stable release tag: $VERSION" >&2; exit 1; }
            publish=true
          fi
          if [[ -n "$version" && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          # Release candidates carry a "-N" suffix and also get the moving tag rc.
          rc=false
          [[ "$version" == *-* ]] && rc=true
          echo "version=${version:-dev}" >> "$GITHUB_OUTPUT"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "publish=${publish:-false}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${WEB_IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      # The smoke test builds its empty catalog with a cargo example; the Rust toolchain that the
      # GitHub runner image already contains is used (no extra third-party action).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the candidate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker-web/Dockerfile
          load: true
          tags: candidate:web-test
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=docker-web
          cache-to: type=gha,mode=max,scope=docker-web

      - name: Smoke test
        run: bash docker-web/scripts/ci-smoke.sh candidate:web-test

      # STEP preview in the hardened container (read-only, no capabilities, Docker's default
      # seccomp), run as the image's own user (65532) on named volumes.
      - name: STEP preview smoke test
        env:
          SMOKE_DEFAULT_USER: "1"
        run: bash docker-web/scripts/step-smoke.sh candidate:web-test

      # Budget of the web image: sum of the compressed layers at most 250 MB (decision R7).
      - name: Image size budget
        run: bash docker-web/scripts/image-size.sh candidate:web-test 250000000

      # Hand the tested image to the publish job unchanged.
      - name: Save the tested image
        if: steps.meta.outputs.publish == 'true'
        run: docker save candidate:web-test -o web-image.tar

      - name: Keep the tested image
        if: steps.meta.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-image
          path: web-image.tar
          retention-days: 1

  # Runs only for an explicit publish=true or a published stable release. The only job with a package-write token.
  publish:
    needs: web-image
    if: needs.web-image.outputs.publish == 'true'
    # One publish at a time for this image (automatic on release and manual runs share the group),
    # queued instead of cancelled: the "latest" decision below reads the release list right before
    # the push, so a slower older run can no longer move "latest" back after a newer one.
    # (GitHub keeps one pending run per group; a newer pending run replaces an older pending one.)
    concurrency:
      group: docker-web-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fetch the tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-image

      - name: Load the tested image
        run: docker load -i web-image.tar

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image
        shell: bash
        env:
          IMAGE: ${{ needs.web-image.outputs.image }}
          VERSION: ${{ needs.web-image.outputs.version }}
          RC: ${{ needs.web-image.outputs.rc }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VERSION" != dev ]] || { echo "publish needs a version" >&2; exit 1; }
          tags=("$IMAGE:$VERSION")
          if [[ "$RC" == true ]]; then
            tags+=("$IMAGE:rc")
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Same rule as docker-image.yml: latest follows only the highest published stable release,
            # read from the release list now, so rebuilding an older version never moves it back.
            HIGHEST=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
              | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -V | tail -1)
            [[ "$VERSION" == "$HIGHEST" ]] && tags+=("$IMAGE:latest")
          fi
          for t in "${tags[@]}"; do
            docker tag candidate:web-test "$t"
            docker push "$t"
          done
