name: Notify Discord on Issue

on:
  issues:
    types: [opened]

# No workflow_dispatch for re-posting here - the separate import script
# (discord-setup/import-github-issues.js) can add any existing issues
# selectively (with a preview) instead of blindly re-posting "the last opened
# issue".

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Determine target forum channel from labels
        id: target
        env:
          # Only label names, no free-text issue content - not critical for command
          # injection, but still via env instead of ${{ }} interpolation into the script
          # text (same caution as in discord-release-notify.yml).
          LABELS_JSON: ${{ toJson(github.event.issue.labels.*.name) }}
        run: |
          HAS_BUG=$(echo "$LABELS_JSON" | jq 'any(. == "bug")')
          HAS_ENHANCEMENT=$(echo "$LABELS_JSON" | jq 'any(. == "enhancement")')

          if [ "$HAS_BUG" = "true" ]; then
            echo "channel_id=1551177227683496026" >> "$GITHUB_OUTPUT"   # #bug-reports
            echo "tag_id=1551177227683496027" >> "$GITHUB_OUTPUT"        # Offen/Open
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_ENHANCEMENT" = "true" ]; then
            echo "channel_id=1551177231689064539" >> "$GITHUB_OUTPUT"   # #feature-wünsche-requests
            echo "tag_id=1551177231689064540" >> "$GITHUB_OUTPUT"        # Offen/Open
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            # Labeled neither "bug" nor "enhancement" (e.g. only "question"/
            # "documentation") - deliberately NOT posted instead of guessing the wrong
            # channel. Can be added later via import-github-issues.js once a matching
            # label is set.
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Post issue to Discord forum
        if: steps.target.outputs.skip != 'true'
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: ${{ steps.target.outputs.channel_id }}
          TAG_ID: ${{ steps.target.outputs.tag_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          # Discord thread names are limited to 100 characters.
          THREAD_NAME=$(echo "#$ISSUE_NUMBER $ISSUE_TITLE" | head -c 100)

          # Forum post content is limited to 2000 characters (normal message content
          # limit, also applies to a forum thread's starter message).
          BODY=$(echo "$ISSUE_BODY" | head -c 1700)
          CONTENT=$(printf '**Importiert von GitHub-Issue #%s** von @%s\n%s\n\n%s' \
            "$ISSUE_NUMBER" "$ISSUE_AUTHOR" "$ISSUE_URL" "$BODY")

          PAYLOAD=$(jq -n \
            --arg name "$THREAD_NAME" \
            --arg content "$CONTENT" \
            --arg tag "$TAG_ID" \
            '{
              name: $name,
              message: { content: $content },
              applied_tags: [$tag]
            }')

          curl -sS -f \
            -H "Authorization: Bot $BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST -d "$PAYLOAD" \
            "https://discord.com/api/v10/channels/$CHANNEL_ID/threads"
