name: Notify Discord on Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag erneut posten (z.B. v0.10.1)"
        required: true

permissions:
  contents: read

jobs:
  notify:
    # The fixed pre-release `preview` carries test versions, not a release to announce.
    if: github.event_name != 'release' || github.event.release.tag_name != 'preview'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Post release to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          DISCORD_RELEASE_WEBHOOK_DE: ${{ secrets.DISCORD_RELEASE_WEBHOOK_DE }}
          DISCORD_RELEASE_WEBHOOK_EN: ${{ secrets.DISCORD_RELEASE_WEBHOOK_EN }}
        run: python3 .github/scripts/release_discord.py
