name: Build Windows MSI (with STEP preview)

on:
  workflow_dispatch: {}

jobs:
  build-windows-step:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # windows-latest bringt MSVC Build Tools und CMake bereits mit - anders
      # als eine frisch aufgesetzte VM braucht der Runner hier keine
      # zusaetzliche Installation dafuer.
      #
      # OCCT selbst gibt es fuer Windows nicht als Systempaket, deshalb ueber
      # vcpkg gebaut, gepinnt auf die in
      # src-tauri/vendor/opencascade-sys/VENDORING.md dokumentierte und
      # lokal verifizierte Version (7.9.3). Manifest liegt unter
      # src-tauri/occt-vcpkg-manifest/vcpkg.json.
      #
      # lukka/run-vcpkg statt eigenem git-clone/checkout-Scripting: ein
      # erster manueller Versuch (git clone + git checkout <commit> per
      # Hand) scheiterte reproduzierbar auf dem GitHub-Runner mit "path
      # 'versions/baseline.json' exists on disk, but not in <commit>",
      # obwohl Commit und Datei auf GitHub nachweislich existieren (per
      # curl gegengeprueft) - vermutlich eine Eigenheit des manuellen
      # Checkouts auf dem Runner. Die etablierte Action uebernimmt dasselbe
      # Vorgehen zuverlaessig.
      #
      # runVcpkgInstall: true ist noetig, sonst richtet die Action nur das
      # vcpkg-Tooling ein, OHNE das Manifest tatsaechlich zu installieren
      # (zweiter Fehlversuch: Job lief nur 54s durch, "vcpkg_installed"
      # blieb leer). Bonus: die Action bringt GitHub-Actions-Binary-Caching
      # (VCPKG_BINARY_SOURCES=x-gha) automatisch mit, das war ohnehin als
      # spaeterer Ausbau geplant - kompletter Build dauert ohne Cache lokal
      # verifiziert rund 1,4 Stunden, mit Cache auf Wiederholungslaeufen
      # deutlich weniger.
      # runVcpkgInstall bewusst weggelassen (anders als zuvor): die Action
      # installiert das Manifest sonst selbst in einen intern gehashten
      # Ordner (z.B. "<guid>/vcpkg_installed"), dessen genauer Pfad nicht
      # dokumentiert/stabil vorhersagbar ist - ein erster CI-Lauf baute OCCT
      # damit zwar erfolgreich durch (1,4h), aber der nachfolgende
      # Staging-Schritt griff daneben, weil er den vorhersehbaren Pfad
      # "src-tauri/occt-vcpkg-manifest/vcpkg_installed/x64-windows" erwartet
      # (siehe VENDORING.md, lokal so verifiziert). Deshalb hier: Action nur
      # zum Einrichten des vcpkg-Tools nutzen (setzt RUNVCPKG_VCPKG_ROOT und
      # das GitHub-Actions-Binary-Caching via VCPKG_BINARY_SOURCES=x-gha),
      # den eigentlichen "vcpkg install" danach explizit mit exakt diesem
      # Zielpfad selbst aufrufen.
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 5f96cd15fd745122cf27e0524606d6c1efc5fd07

      - name: Build OCCT 7.9.3 via vcpkg manifest
        working-directory: src-tauri/occt-vcpkg-manifest
        run: |
          & "$env:RUNVCPKG_VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows --x-install-root vcpkg_installed
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed with exit code $LASTEXITCODE" }

      - name: Stage OCCT runtime DLLs
        run: |
          .\src-tauri\scripts\stage-occt-dlls.ps1 -VcpkgInstalledDir "${{ github.workspace }}\src-tauri\occt-vcpkg-manifest\vcpkg_installed\x64-windows"

      - name: Build Tauri app (Windows MSI, with STEP preview)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CMAKE_PREFIX_PATH: ${{ github.workspace }}\src-tauri\occt-vcpkg-manifest\vcpkg_installed\x64-windows
        run: npm run tauri build -- --bundles msi --config src-tauri\tauri.windows-step.conf.json

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3mf-katalog-manager-windows-msi-step
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
