name: Build Windows MSI (with STEP preview)

on:
  workflow_dispatch: {}

# packages: write for the vcpkg binary cache in GitHub Packages (NuGet), see the
# "Setup vcpkg binary cache" step below.
permissions:
  contents: read
  packages: write

env:
  VCPKG_NUGET_FEED: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

jobs:
  build-windows-step:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # windows-latest already includes the MSVC build tools and CMake.
      #
      # OCCT isn't available as a system package on Windows, so it's built via vcpkg,
      # pinned in src-tauri/occt-vcpkg-manifest/vcpkg.json.
      #
      # lukka/run-vcpkg only sets up the vcpkg tool (RUNVCPKG_VCPKG_ROOT); we then call
      # "vcpkg install" ourselves with a fixed --x-install-root, because the staging
      # step needs that predictable path (see VENDORING.md).
      #
      # Binary cache: vcpkg stores the finished packages as NuGet packages in this
      # repo's GitHub Packages (the x-gha backend no longer exists). Unlike the
      # Actions cache, it doesn't expire after 7 days. A rebuild (~1.1 h) only happens
      # for a new OCCT version, vcpkg commit or triplet.
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 5f96cd15fd745122cf27e0524606d6c1efc5fd07

      - name: Setup vcpkg binary cache (GitHub Packages / NuGet)
        shell: pwsh
        run: |
          $nuget = & "$env:RUNVCPKG_VCPKG_ROOT\vcpkg.exe" fetch nuget | Select-Object -Last 1
          & $nuget sources add -Source "$env:VCPKG_NUGET_FEED" -StorePasswordInClearText -Name GitHubPackages -UserName "${{ github.repository_owner }}" -Password "${{ secrets.GITHUB_TOKEN }}"
          if ($LASTEXITCODE -ne 0) { throw "nuget sources add failed" }
          & $nuget setapikey "${{ secrets.GITHUB_TOKEN }}" -Source "$env:VCPKG_NUGET_FEED"
          if ($LASTEXITCODE -ne 0) { throw "nuget setapikey failed" }

      - name: Build OCCT 7.9.3 via vcpkg manifest
        working-directory: src-tauri/occt-vcpkg-manifest
        env:
          # Overrides the (removed) x-gha source set by lukka/run-vcpkg.
          VCPKG_BINARY_SOURCES: clear;nuget,${{ env.VCPKG_NUGET_FEED }},readwrite
        run: |
          & "$env:RUNVCPKG_VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows --x-install-root vcpkg_installed
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed with exit code $LASTEXITCODE" }

      - name: Stage OCCT runtime DLLs
        run: |
          .\src-tauri\scripts\stage-occt-dlls.ps1 -VcpkgInstalledDir "${{ github.workspace }}\src-tauri\occt-vcpkg-manifest\vcpkg_installed\x64-windows"

      - name: Build Tauri app (Windows MSI, with STEP preview)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CMAKE_PREFIX_PATH: ${{ github.workspace }}\src-tauri\occt-vcpkg-manifest\vcpkg_installed\x64-windows
        run: npm run tauri build -- --bundles msi --config src-tauri\tauri.windows-step.conf.json

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3mf-katalog-manager-windows-msi-step
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
