name: Build Windows MSI (with STEP preview)

on:
  workflow_dispatch: {}

# packages: write fuer den vcpkg-Binary-Cache in GitHub Packages (NuGet),
# siehe Schritt "Setup vcpkg binary cache" unten.
permissions:
  contents: read
  packages: write

env:
  VCPKG_NUGET_FEED: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

jobs:
  build-windows-step:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # windows-latest bringt MSVC Build Tools und CMake bereits mit - anders
      # als eine frisch aufgesetzte VM braucht der Runner hier keine
      # zusaetzliche Installation dafuer.
      #
      # OCCT selbst gibt es fuer Windows nicht als Systempaket, deshalb ueber
      # vcpkg gebaut, gepinnt auf die in
      # src-tauri/occt-vcpkg-manifest/vcpkg.json.
      #
      # lukka/run-vcpkg richtet nur das vcpkg-Tool ein (RUNVCPKG_VCPKG_ROOT);
      # "vcpkg install" rufen wir danach selbst mit festem --x-install-root
      # auf, weil der Staging-Schritt diesen vorhersagbaren Pfad braucht
      # (siehe VENDORING.md).
      #
      # Binary-Cache: Das fruehere GitHub-Actions-Backend (x-gha) hat vcpkg
      # entfernt - bis v0.13.1 wurde OCCT deshalb bei JEDEM Lauf neu gebaut
      # (ca. 1,1 h). Jetzt legt vcpkg die fertigen Pakete als NuGet-Pakete in
      # GitHub Packages dieses Repos ab (von vcpkg selbst empfohlen). Anders
      # als der Actions-Cache verfaellt das nicht nach 7 Tagen ohne Zugriff.
      # Neu gebaut wird nur, wenn sich OCCT-Version, vcpkg-Commit oder Triplet
      # aendern (dann einmal ~1,1 h, danach wieder aus dem Cache).
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 5f96cd15fd745122cf27e0524606d6c1efc5fd07

      - name: Setup vcpkg binary cache (GitHub Packages / NuGet)
        shell: pwsh
        run: |
          $nuget = & "$env:RUNVCPKG_VCPKG_ROOT\vcpkg.exe" fetch nuget | Select-Object -Last 1
          & $nuget sources add -Source "$env:VCPKG_NUGET_FEED" -StorePasswordInClearText -Name GitHubPackages -UserName "${{ github.repository_owner }}" -Password "${{ secrets.GITHUB_TOKEN }}"
          if ($LASTEXITCODE -ne 0) { throw "nuget sources add failed" }
          & $nuget setapikey "${{ secrets.GITHUB_TOKEN }}" -Source "$env:VCPKG_NUGET_FEED"
          if ($LASTEXITCODE -ne 0) { throw "nuget setapikey failed" }

      - name: Build OCCT 7.9.3 via vcpkg manifest
        working-directory: src-tauri/occt-vcpkg-manifest
        env:
          # Ueberschreibt das von lukka/run-vcpkg gesetzte (entfernte) x-gha.
          VCPKG_BINARY_SOURCES: clear;nuget,${{ env.VCPKG_NUGET_FEED }},readwrite
        run: |
          & "$env:RUNVCPKG_VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows --x-install-root vcpkg_installed
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed with exit code $LASTEXITCODE" }

      - name: Stage OCCT runtime DLLs
        run: |
          .\src-tauri\scripts\stage-occt-dlls.ps1 -VcpkgInstalledDir "${{ github.workspace }}\src-tauri\occt-vcpkg-manifest\vcpkg_installed\x64-windows"

      - name: Build Tauri app (Windows MSI, with STEP preview)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CMAKE_PREFIX_PATH: ${{ github.workspace }}\src-tauri\occt-vcpkg-manifest\vcpkg_installed\x64-windows
        run: npm run tauri build -- --bundles msi --config src-tauri\tauri.windows-step.conf.json

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3mf-katalog-manager-windows-msi-step
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
