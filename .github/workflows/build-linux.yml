name: Build Linux AppImage (with STEP preview)

on:
  workflow_dispatch: {}
  # Also called by release.yml, which builds every variant in one run, and by
  # preview.yml, which builds the separately installed test app.
  workflow_call:
    inputs:
      preview:
        type: boolean
        default: false
      # Empty keeps the version from Cargo.toml/tauri.conf.json.
      version:
        type: string
        default: ""

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    env:
      APP_NAME: ${{ inputs.preview && '3MF Katalog Manager Preview' || '3MF Katalog Manager' }}
      PREVIEW_CONFIG: ${{ inputs.preview && '--config src-tauri/tauri.preview.conf.json' || '' }}
      PREVIEW_FEATURES: ${{ inputs.preview && '--features preview' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            cmake

      # ubuntu-24.04 (noble) only ships OCCT 7.6.3 via apt, which doesn't meet the
      # supported version (7.8 or 7.9). The FreeCAD maintainers PPA provides OCCT
      # 7.8.1 for noble. Before any change here: verify package names/version on the
      # real runner, the PPA can change its content.
      - name: Install OCCT 7.8 (dynamic libraries) from FreeCAD maintainers PPA
        run: |
          sudo add-apt-repository -y ppa:freecad-maintainers/occt-releases
          sudo apt-get update
          sudo apt-get install -y \
            libocct-foundation-dev \
            libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev \
            libocct-data-exchange-dev \
            libocct-ocaf-dev \
            libocct-visualization-dev

      - name: Install frontend dependencies
        run: npm ci

      # Test versions are numbered at build time instead of being committed.
      - name: Set the build version
        if: ${{ inputs.version != '' }}
        shell: bash
        run: $(command -v python3 || command -v python) tools/release_assets.py set-version "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      # linuxdeploy's bundled `strip` doesn't know newer ELF SHT_RELR sections
      # (confirmed locally on CachyOS/Arch). NO_STRIP=1 is an official linuxdeploy
      # switch that leaves the binaries unstripped instead of failing the bundling
      # step. The error didn't occur on Ubuntu locally, but the switch is harmless
      # and keeps the build reliably reproducible.
      - name: Build Tauri app (AppImage, with STEP preview)
        env:
          NO_STRIP: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run tauri build -- --bundles appimage $PREVIEW_CONFIG -- $PREVIEW_FEATURES

      # Tauri's default AppImage bundling (linuxdeploy) includes outdated
      # libwayland-*/libxkbcommon/libxcb-*/libXau/libXdmcp that crash WebKitGTK's EGL
      # initialization on target machines with a newer Mesa ("Could not create default
      # EGL display: EGL_BAD_PARAMETER. Aborting..."). See the script comment and
      # github.com/tauri-apps/tauri issue #15976 for details/verification.
      - name: Fix AppImage EGL crash (exclude bundled display-stack libs)
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage")
          ./src-tauri/scripts/fix-appimage-egl-linux.sh "$APPIMAGE"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3mf-katalog-manager-linux-appimage-step
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
