name: Build Linux AppImage

on:
  workflow_dispatch: {}

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            cmake

      # ubuntu-24.04 (noble) liefert ueber apt nur OCCT 7.6.3, das die
      # freigegebene Version (7.8 oder 7.9) nicht erfuellt. Die
      # FreeCAD-Maintainer-PPA stellt OCCT 7.8.1 fuer Noble bereit.
      # Vor jeder Aenderung hier: Paketnamen/Version auf dem echten Runner
      # gegenpruefen, die PPA kann ihren Inhalt aendern.
      - name: Install OCCT 7.8 (dynamic libraries) from FreeCAD maintainers PPA
        run: |
          sudo add-apt-repository -y ppa:freecad-maintainers/occt-releases
          sudo apt-get update
          sudo apt-get install -y \
            libocct-foundation-dev \
            libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev \
            libocct-data-exchange-dev \
            libocct-ocaf-dev \
            libocct-visualization-dev

      - name: Install frontend dependencies
        run: npm ci

      # linuxdeploy's mitgeliefertes `strip` kennt neuere ELF-SHT_RELR-
      # Sektionen nicht (bestaetigter lokaler Befund auf CachyOS/Arch).
      # NO_STRIP=1 ist ein offizieller linuxdeploy-Schalter und laesst die
      # Binaries ungestrippt, statt den Bundling-Schritt fehlschlagen zu
      # lassen. Auf Ubuntu trat der Fehler lokal nicht auf, aber der
      # Schalter ist harmlos und haelt den Build reproduzierbar sicher.
      - name: Build Tauri app (AppImage, with STEP preview)
        env:
          NO_STRIP: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run tauri build -- --bundles appimage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3mf-katalog-manager-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
