name: Build macOS DMG (with STEP preview)

on:
  workflow_dispatch: {}

jobs:
  build-macos-step:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Beide Ziel-Architekturen: der Runner selbst ist arm64 (macos-latest),
      # x86_64-apple-darwin wird per Rosetta-emulierter Homebrew-Installation
      # (siehe unten) mit eigener OCCT-Installation ausgestattet - kein
      # separater Intel-Runner noetig.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Native arm64-Homebrew (bereits vorinstalliert unter /opt/homebrew
      # auf github-gehosteten arm64-Runnern) liefert die arm64-OCCT-
      # Installation - wie im bisherigen Single-Arch-Workflow.
      - name: Install arm64 OCCT + dylibbundler via Homebrew
        run: brew install opencascade dylibbundler

      # Zweite, komplett unabhaengige Homebrew-Installation unter Rosetta
      # 2 (praeinstalliert auf github-gehosteten macOS-Runnern, nur die
      # Lizenz muss aktiviert werden). Installiert klassisch unter
      # /usr/local statt /opt/homebrew - beide Installationen koexistieren
      # konfliktfrei nebeneinander. Liefert die x86_64-OCCT-Installation,
      # die fuer den x86_64-apple-darwin-Cargo-Build noetig ist.
      - name: Install x86_64 OCCT via Rosetta-emulated Homebrew
        run: |
          softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          arch -x86_64 /usr/local/bin/brew install opencascade dylibbundler

      # --- arm64-Build ---
      - name: Build Tauri app (arm64, with STEP preview)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export CMAKE_PREFIX_PATH="$(brew --prefix opencascade)"
          npm run tauri build -- --target aarch64-apple-darwin --bundles app

      - name: Bundle OCCT dylibs into the arm64 .app
        run: |
          ./src-tauri/scripts/bundle-occt-dylibs-macos.sh "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/3MF Katalog Manager.app"

      # --- x86_64-Build ---
      - name: Build Tauri app (x86_64, with STEP preview)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export CMAKE_PREFIX_PATH="$(arch -x86_64 /usr/local/bin/brew --prefix opencascade)"
          npm run tauri build -- --target x86_64-apple-darwin --bundles app

      - name: Bundle OCCT dylibs into the x86_64 .app
        run: |
          ./src-tauri/scripts/bundle-occt-dylibs-macos.sh "src-tauri/target/x86_64-apple-darwin/release/bundle/macos/3MF Katalog Manager.app"

      # --- Zusammenfuehren zu einem echten Universal-Bundle ---
      - name: Merge arm64 + x86_64 into one universal .app
        run: |
          ./src-tauri/scripts/merge-universal-step-macos.sh \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/3MF Katalog Manager.app" \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/macos/3MF Katalog Manager.app" \
            "src-tauri/target/universal-step/3MF Katalog Manager.app"

      - name: Package DMG from the universal .app
        run: |
          mkdir -p src-tauri/target/universal-step/dmg
          hdiutil create -volname "3MF Katalog Manager" \
            -srcfolder "src-tauri/target/universal-step/3MF Katalog Manager.app" \
            -ov -format UDZO \
            "src-tauri/target/universal-step/dmg/3MF Katalog Manager_universal-step.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3mf-katalog-manager-macos-dmg-universal-step
          path: src-tauri/target/universal-step/dmg/*.dmg
          if-no-files-found: error
