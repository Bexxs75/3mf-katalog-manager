name: Preview (test version)

# Builds a test version ("3MF Katalog Manager Preview", own identifier and catalog)
# and replaces the files of the fixed pre-release `preview`. Test versions update
# only from this channel. Runs by hand, or by pushing a tag preview-<version>
# (add -step for the STEP variants) - the tag route works before this file is on
# the default branch.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Test version x.y.z-n (numeric n), e.g. 0.15.0-2"
        required: true
        type: string
      step:
        description: "Also build the STEP variants"
        type: boolean
        default: false
  push:
    tags: ["preview-*"]

permissions:
  contents: read

# Publishing rewrites and prunes the shared "preview" release's assets, so two
# runs at once could interleave their uploads/deletes into a broken release;
# queue instead of racing them, and never cancel a run partway through that.
concurrency:
  group: preview-channel
  cancel-in-progress: false

jobs:
  params:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.p.outputs.version }}
      step: ${{ steps.p.outputs.step }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: p
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_STEP: ${{ inputs.step }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = "push" ]; then
            V="${REF_NAME#preview-}"; S=false
            case "$V" in *-step) V="${V%-step}"; S=true;; esac
          else
            V="$IN_VERSION"; S="$IN_STEP"
          fi
          R="$GITHUB_REPOSITORY"
          # No "preview" release yet is normal (the very first run); a release that
          # exists but happens to have no latest-preview.json (e.g. only STEP was
          # ever published) is also fine. Only a download that fails for another
          # reason (rate limit, network) should stop the run.
          if gh release view preview -R "$R" >/dev/null 2>&1; then
            if gh release view preview -R "$R" --json assets -q '.assets[].name' | grep -qxF latest-preview.json; then
              gh release download preview -R "$R" -p latest-preview.json -O current.json \
                || { echo "cannot read the published manifest"; exit 1; }
            fi
          fi
          python3 tools/release_assets.py check-preview "$V" current.json
          # The test assistant is built only after all builds; fail now instead of
          # after an hour of building - this also catches a scenario file that
          # testanleitung.py cannot parse (missing block, picture or placeholder, ...).
          test -f "docs/tests/$V.md" || { echo "docs/tests/$V.md is missing"; exit 1; }
          test -f "docs/tests/$V.en.md" || { echo "docs/tests/$V.en.md is missing"; exit 1; }
          for l in de en; do python3 tools/testanleitung.py "$V" linux "$RUNNER_TEMP/guide-check" --lang=$l --assistant-only; done
          echo "version=$V" >> "$GITHUB_OUTPUT"; echo "step=$S" >> "$GITHUB_OUTPUT"

  windows:
    needs: params
    uses: ./.github/workflows/build-windows.yml
    with: { preview: true, version: "${{ needs.params.outputs.version }}" }
  macos:
    needs: params
    uses: ./.github/workflows/build-macos.yml
    with: { preview: true, version: "${{ needs.params.outputs.version }}" }
  linux:
    needs: params
    uses: ./.github/workflows/build-linux-nostep.yml
    with: { preview: true, version: "${{ needs.params.outputs.version }}" }
  windows-step:
    needs: params
    if: needs.params.outputs.step == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-windows-step.yml
    with: { preview: true, version: "${{ needs.params.outputs.version }}" }
  macos-step:
    needs: params
    if: needs.params.outputs.step == 'true'
    uses: ./.github/workflows/build-macos-step.yml
    with: { preview: true, version: "${{ needs.params.outputs.version }}" }
  linux-step:
    needs: params
    if: needs.params.outputs.step == 'true'
    uses: ./.github/workflows/build-linux.yml
    with: { preview: true, version: "${{ needs.params.outputs.version }}" }

  publish:
    needs: [params, windows, macos, linux, windows-step, macos-step, linux-step]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.params.outputs.version }}
      STEP: ${{ needs.params.outputs.step }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          pattern: 3mf-katalog-manager-*
          path: artifacts
      - name: Readable file names
        run: |
          FLAGS="--preview"; [ "$STEP" = "true" ] || FLAGS="$FLAGS --no-step"
          python3 tools/release_assets.py rename "$VERSION" artifacts dist $FLAGS
      # Pinned because this step receives the private key.
      - name: Sign the update packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in dist/*.msi dist/*.app.tar.gz dist/*.AppImage; do
            npx --yes @tauri-apps/cli@2.11.4 signer sign "$f"
          done
      - name: Updater manifests
        run: |
          FLAGS="--preview"; [ "$STEP" = "true" ] || FLAGS="$FLAGS --no-step"
          python3 tools/release_assets.py latest-json "$VERSION" dist $FLAGS
      # Testers get only the interactive test assistant (one HTML per system and language).
      - name: Test assistant
        run: |
          NOSTEP=""; [ "$STEP" = "true" ] || NOSTEP="--no-step"
          for l in de en; do
            for p in windows macos linux; do python3 tools/testanleitung.py "$VERSION" "$p" guide --lang=$l --assistant-only $NOSTEP; done
          done
          # Published without the version so the links stay the same across test
          # versions (website, Discord, forum posts), with the language in the name:
          # Testassistent-DE-Windows.html, Test-Assistant-EN-Windows.html, ...
          # The website reads the version from the installer names instead.
          for f in guide/Testassistent-*.html guide/Test-Assistant-*.html; do
            b=$(basename "$f"); b="${b/-$VERSION/}"
            b="${b/Testassistent-/Testassistent-DE-}"; b="${b/Test-Assistant-/Test-Assistant-EN-}"
            cp "$f" "dist/$b"
          done
      - name: Checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          # A run without STEP never regenerates those checksums, but the
          # previous STEP files stay published (see below) - carry their lines
          # over so SHA256SUMS.txt still lists every file the release has.
          if [ "$STEP" != "true" ] && gh release view preview -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download preview -R "$GITHUB_REPOSITORY" -p SHA256SUMS.txt -O previous-SHA256SUMS.txt 2>/dev/null || true
            if [ -f previous-SHA256SUMS.txt ]; then
              grep -E -- '-STEP\.| latest-preview-step\.json$' previous-SHA256SUMS.txt >> SHA256SUMS.txt || true
              rm previous-SHA256SUMS.txt
            fi
          fi
          # The test data ZIP is uploaded by hand and kept across runs (see the
          # publish step), so its checksum line is carried over as well.
          if gh release view preview -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download preview -R "$GITHUB_REPOSITORY" -p SHA256SUMS.txt -O previous-SHA256SUMS.txt 2>/dev/null || true
            if [ -f previous-SHA256SUMS.txt ]; then
              grep -E -- ' 3MF-Testdaten\.zip$' previous-SHA256SUMS.txt >> SHA256SUMS.txt || true
              rm previous-SHA256SUMS.txt
            fi
          fi
      # Order matters: new packages first, the manifests (which point at them)
      # next, old files last - an update check never sees a manifest whose
      # files are missing.
      - name: Publish to the preview channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$GITHUB_REPOSITORY"
          if ! gh release view preview -R "$R" >/dev/null 2>&1; then
            gh release create preview -R "$R" --prerelease --target "${{ github.sha }}" \
              --title "Test-Version / Test version" --notes "Test versions only. See the test guide PDF."
          fi
          gh release upload preview -R "$R" --clobber $(ls dist/* | grep -v 'latest-preview')
          gh release upload preview -R "$R" --clobber dist/latest-preview*.json
          KEEP=$(cd dist && ls)
          # A run without STEP leaves the previous STEP files and their manifest
          # in place, so installed STEP test versions keep a working channel.
          gh release view preview -R "$R" --json assets -q '.assets[].name' | while read -r a; do
            [ "$a" = "3MF-Testdaten.zip" ] && continue
            if [ "$STEP" != "true" ]; then
              case "$a" in *-STEP.*|latest-preview-step.json) continue;; esac
            fi
            echo "$KEEP" | grep -qxF "$a" || gh release delete-asset preview "$a" -R "$R" --yes
          done
          gh release edit preview -R "$R" --prerelease --title "Test-Version $VERSION / Test version $VERSION" \
            --notes "Test version $VERSION of 3MF Katalog Manager Preview (own catalog, separate from the normal app). Download Testassistent-DE-<system>.html (English: Test-Assistant-EN-<system>.html) and open it with a double-click: it guides you step by step, from the download to sending the result."
