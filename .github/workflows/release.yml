name: Release (draft)

# Builds the three STEP packages in one run, gives the files readable names, signs the
# update packages, writes the updater manifests and creates a DRAFT release.
# Nothing becomes visible to users (or to the in-app updater) until the draft is
# published by hand.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v, e.g. 0.15.0 or 0.15.0-1 (MSI needs a numeric pre-release; a pre-release also gets the NSIS installer)"
        required: true
        type: string

# Read-only by default; only the jobs that need more ask for it.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      # The NSIS installer is only built for pre-release versions (release
      # candidates, e.g. 0.18.0-1) until it has proven itself; a stable version
      # ships the MSI alone, exactly as before.
      nsis: ${{ steps.nsis.outputs.nsis }}
    steps:
      - uses: actions/checkout@v4
      # Passed through env instead of being pasted into the script, so the input
      # can never be interpreted as shell code.
      - name: Version matches Cargo.toml and tauri.conf.json
        env:
          VERSION: ${{ inputs.version }}
        run: python3 tools/release_assets.py check-version "$VERSION"
      - name: NSIS installer only for pre-release versions
        id: nsis
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in *-*) echo "nsis=true" >> "$GITHUB_OUTPUT";; *) echo "nsis=false" >> "$GITHUB_OUTPUT";; esac

  windows-step:
    needs: verify
    # A called workflow can never get more rights than its caller grants; this
    # build keeps its vcpkg binary cache in GitHub Packages.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-windows-step.yml
    with:
      nsis: ${{ needs.verify.outputs.nsis == 'true' }}
  macos-step:
    needs: verify
    uses: ./.github/workflows/build-macos-step.yml
  linux-step:
    needs: verify
    uses: ./.github/workflows/build-linux.yml
  # The app is started and clicked through on Linux and Windows next to the package builds.
  # "assemble" does not wait for it: the draft is created either way and a red test run is a warning.
  e2e:
    needs: verify
    uses: ./.github/workflows/e2e.yml
  # The slim web image is built and smoke-tested (never published here) next to the package builds.
  # Like e2e, "assemble" does not wait for it: a red run is a warning, not a blocker.
  web-image:
    needs: verify
    # The called workflow declares packages: write for its publish job only; with publish: false that job is skipped, and its build job has a read-only token.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-web.yml
    with:
      version: ${{ inputs.version }}
      publish: false

  assemble:
    needs: [verify, windows-step, macos-step, linux-step]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      # "--require-nsis" for a pre-release: the build must have produced the
      # installer, otherwise the draft is not created.
      NSIS_FLAG: ${{ needs.verify.outputs.nsis == 'true' && '--require-nsis' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Only the final packages; the single-arch .app bundles of the STEP macOS
      # build are intermediate artifacts and not needed here.
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 3mf-katalog-manager-*
          path: artifacts
      - name: Readable file names
        run: python3 tools/release_assets.py rename "$VERSION" artifacts dist $NSIS_FLAG
      # `tauri signer sign` writes the signature next to the file as <file>.sig,
      # which is where the manifest step looks for it. The CLI version is pinned
      # (same as package-lock.json) because this step hands it the private key.
      - name: Sign the update packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # nullglob: a stable version has no Setup.exe, an unmatched pattern must not be signed as a file name.
          shopt -s nullglob
          for f in dist/*.msi dist/*-Setup.exe dist/*.app.tar.gz dist/*.AppImage; do
            npx --yes @tauri-apps/cli@2.11.4 signer sign "$f"
          done
      - name: Updater manifests
        run: python3 tools/release_assets.py latest-json "$VERSION" dist $NSIS_FLAG
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS.txt
      # A version with a hyphen (e.g. 0.15.0-1) is marked as pre-release, so
      # releases/latest - and with it the updater - keeps pointing at the last
      # stable version.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease";; esac
          # The title is only a placeholder: set "vX.Y.Z — <English> / <Deutsch>"
          # (see RELEASE_TEMPLATE.md) before publishing the draft.
          gh release create "v$VERSION" --draft $PRE --target "${{ github.sha }}" \
            --title "v$VERSION" --notes-file .github/RELEASE_TEMPLATE.md dist/*
