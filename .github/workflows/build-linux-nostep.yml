name: Build Linux AppImage (without STEP preview)

on:
  workflow_dispatch: {}
  # Also called by release.yml, which builds every variant in one run, and by
  # preview.yml, which builds the separately installed test app.
  workflow_call:
    inputs:
      preview:
        type: boolean
        default: false
      # Empty keeps the version from Cargo.toml/tauri.conf.json.
      version:
        type: string
        default: ""

jobs:
  build-linux-nostep:
    runs-on: ubuntu-24.04
    env:
      APP_NAME: ${{ inputs.preview && '3MF Katalog Manager Preview' || '3MF Katalog Manager' }}
      PREVIEW_CONFIG: ${{ inputs.preview && '--config src-tauri/tauri.preview.conf.json' || '' }}
      PREVIEW_FEATURES: ${{ inputs.preview && '--features preview' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            cmake

      - name: Install frontend dependencies
        run: npm ci

      # Test versions are numbered at build time instead of being committed.
      - name: Set the build version
        if: ${{ inputs.version != '' }}
        shell: bash
        run: $(command -v python || command -v python3) tools/release_assets.py set-version "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      # No OCCT PPA step here (unlike build-linux.yml) - this variant builds without
      # the STEP preview, so there's no OCCT dependency.
      - name: Build Tauri app (AppImage, without STEP preview)
        env:
          NO_STRIP: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run tauri build -- --bundles appimage $PREVIEW_CONFIG -- --no-default-features $PREVIEW_FEATURES

      # See build-linux.yml for the full rationale: Tauri's default AppImage bundling
      # includes outdated display stack libraries that crash the EGL initialization on
      # target machines with a newer Mesa.
      - name: Fix AppImage EGL crash (exclude bundled display-stack libs)
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage")
          ./src-tauri/scripts/fix-appimage-egl-linux.sh "$APPIMAGE"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3mf-katalog-manager-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
