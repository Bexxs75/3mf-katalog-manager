name: Build Windows MSI

on:
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # STEP-Vorschau bleibt aus, bis OCCT samt austauschbaren DLLs verifiziert
      # paketiert werden kann. So enthaelt dieser Build keinen LGPL-Anteil.
      - name: Build Tauri app (Windows MSI, without STEP preview)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: -- --no-default-features

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3mf-katalog-manager-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
