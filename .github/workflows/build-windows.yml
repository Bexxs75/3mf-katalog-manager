name: Build Windows MSI

on:
  workflow_dispatch: {}
  # Also called by release.yml, which builds every variant in one run, and by
  # preview.yml, which builds the separately installed test app.
  workflow_call:
    inputs:
      preview:
        type: boolean
        default: false
      # Empty keeps the version from Cargo.toml/tauri.conf.json.
      version:
        type: string
        default: ""

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      APP_NAME: ${{ inputs.preview && '3MF Katalog Manager Preview' || '3MF Katalog Manager' }}
      PREVIEW_CONFIG: ${{ inputs.preview && '--config src-tauri/tauri.preview.conf.json' || '' }}
      PREVIEW_FEATURES: ${{ inputs.preview && '--features preview' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Test versions are numbered at build time instead of being committed.
      - name: Set the build version
        if: ${{ inputs.version != '' }}
        shell: bash
        run: $(command -v python3 || command -v python) tools/release_assets.py set-version "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      # The STEP preview stays off until OCCT can be packaged with verified,
      # replaceable DLLs. This way the build contains no LGPL part.
      - name: Build Tauri app (Windows MSI, without STEP preview)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ env.PREVIEW_CONFIG }} -- --no-default-features ${{ env.PREVIEW_FEATURES }}

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3mf-katalog-manager-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
