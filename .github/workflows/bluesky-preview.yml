name: Post preview to Bluesky

# Posts a short "preview" announcement with up to four images to the project's
# Bluesky account. Started by hand (Actions -> "Post preview to Bluesky" -> Run
# workflow); nothing is posted automatically. The app password only exists as a
# repository secret, which is why this runs on GitHub and not locally.
# Images must be committed to the repository (e.g. docs/assets/preview/<version>/).
on:
  workflow_dispatch:
    inputs:
      title:
        description: 'First line, e.g. "🖼️ Preview v0.16.0: Neuer Import / New import"'
        required: true
      body:
        description: "Short text (title + body + link must stay within 300 characters)"
        required: false
        default: ""
      images:
        description: "Image paths in the repository, comma-separated, at most 4"
        required: false
        default: ""
      alts:
        description: "Alt texts separated by |, exactly one per image"
        required: false
        default: ""
      link:
        description: "Optional link (made clickable)"
        required: false
        default: ""
      dry_run:
        description: "Only check and show the post, do not send it"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow (resizes images above the Bluesky blob limit)
        run: python3 -m pip install --quiet pillow
      - name: Compose and post
        env:
          # Inputs go through env, never interpolated into the script text.
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
          IMAGES: ${{ inputs.images }}
          ALTS: ${{ inputs.alts }}
          LINK: ${{ inputs.link }}
          DRY_RUN: ${{ inputs.dry_run }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          ARGS=(--title "$TITLE" --body "$BODY" --images "$IMAGES" --alts "$ALTS" --link "$LINK")
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python3 tools/bluesky_preview.py "${ARGS[@]}"
