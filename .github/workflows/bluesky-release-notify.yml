name: Notify Bluesky on Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag erneut posten (z.B. v0.11.0)"
        required: true

jobs:
  notify:
    # The fixed pre-release `preview` carries test versions, not a release to announce.
    if: github.event_name != 'release' || github.event.release.tag_name != 'preview'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release data
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_INPUT: ${{ inputs.tag }}
          # Same caution as in discord-release-notify.yml: release name/body are repo
          # content, so pass them via env instead of ${{ }} interpolation into the
          # script text (command injection protection).
          EVENT_NAME: ${{ github.event.release.name }}
          EVENT_URL: ${{ github.event.release.html_url }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_BODY: ${{ github.event.release.body }}
        run: |
          if [ -n "$TAG_INPUT" ]; then
            DATA=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG_INPUT")
            echo "name=$(echo "$DATA" | jq -r '.name')" >> "$GITHUB_OUTPUT"
            echo "url=$(echo "$DATA" | jq -r '.html_url')" >> "$GITHUB_OUTPUT"
            echo "tag=$(echo "$DATA" | jq -r '.tag_name')" >> "$GITHUB_OUTPUT"
            {
              echo "body<<RELEASE_BODY_EOF"
              echo "$DATA" | jq -r '.body'
              echo "RELEASE_BODY_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "name=$EVENT_NAME" >> "$GITHUB_OUTPUT"
            echo "url=$EVENT_URL" >> "$GITHUB_OUTPUT"
            echo "tag=$EVENT_TAG" >> "$GITHUB_OUTPUT"
            {
              echo "body<<RELEASE_BODY_EOF"
              echo "$EVENT_BODY"
              echo "RELEASE_BODY_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Compose post text (300 grapheme limit)
        id: post
        env:
          RELEASE_NAME: ${{ steps.release.outputs.name }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          RELEASE_BODY: ${{ steps.release.outputs.body }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: |
          # jq cuts strings by character (Unicode code points), not by byte like
          # `head -c` - important with such a tight limit (300 characters), so emojis or
          # umlauts aren't cut in half, producing invalid UTF-8.
          TITLE="${RELEASE_NAME:-$TAG_NAME}"
          FIRST_LINE=$(echo "$RELEASE_BODY" | grep -v '^$' | grep -v '^##' | head -1)

          TEXT=$(jq -rn \
            --arg title "$TITLE" \
            --arg excerpt "$FIRST_LINE" \
            --arg url "$RELEASE_URL" \
            '
            def clip(n): if (length > n) then .[0:n] + "…" else . end;
            # Whole post ≤ 300 graphemes: the excerpt gets what title and URL leave
            # over (v0.15.1 failed with 400 because a long bilingual title plus a
            # 150-character excerpt went past the limit).
            ($title | clip(120)) as $t
            | ([40, 290 - ($t | length) - ($url | length) - 12] | max) as $room
            | "🚀 " + $t + " ist da!\n\n" + ($excerpt | clip($room)) + "\n\n" + $url
            ')

          {
            echo "text<<POST_TEXT_EOF"
            echo "$TEXT"
            echo "POST_TEXT_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

      - name: Skip if this release was already posted
        id: dedupe
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          POST_URL: ${{ steps.post.outputs.url }}
        run: |
          # The author feed is public; a post that already carries this release URL
          # means the announcement went out (e.g. a manual re-run after a failure).
          FEED=$(curl -sS "https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed?actor=${BLUESKY_HANDLE}&limit=30&filter=posts_no_replies" || echo '{}')
          if echo "$FEED" | jq -e --arg url "$POST_URL" '[.feed[]?.post.record.text // ""] | any(contains($url))' >/dev/null; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release already posted on Bluesky ($POST_URL), skipping."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post to Bluesky
        if: steps.dedupe.outputs.already != 'true'
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          POST_TEXT: ${{ steps.post.outputs.text }}
          POST_URL: ${{ steps.post.outputs.url }}
        run: |
          # 1. Create a session (app password, NOT the main password).
          SESSION=$(curl -sS -f -X POST \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg id "$BLUESKY_HANDLE" --arg pw "$BLUESKY_APP_PASSWORD" '{identifier:$id, password:$pw}')" \
            "https://bsky.social/xrpc/com.atproto.server.createSession")
          ACCESS_JWT=$(echo "$SESSION" | jq -r '.accessJwt')
          DID=$(echo "$SESSION" | jq -r '.did')

          # 2. Determine the byte offsets of the link inside the post text - Bluesky
          # facets (clickable links) reference UTF-8 byte positions, not character
          # indices. `wc -c` always counts bytes (regardless of locale), which is
          # exactly what's needed here.
          PREFIX="${POST_TEXT%%"$POST_URL"*}"
          BYTE_START=$(printf '%s' "$PREFIX" | wc -c)
          URL_BYTES=$(printf '%s' "$POST_URL" | wc -c)
          BYTE_END=$((BYTE_START + URL_BYTES))

          RECORD=$(jq -n \
            --arg text "$POST_TEXT" \
            --arg url "$POST_URL" \
            --argjson byteStart "$BYTE_START" \
            --argjson byteEnd "$BYTE_END" \
            --arg now "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            '{
              "$type": "app.bsky.feed.post",
              text: $text,
              createdAt: $now,
              facets: [{
                index: { byteStart: $byteStart, byteEnd: $byteEnd },
                features: [{ "$type": "app.bsky.richtext.facet#link", uri: $url }]
              }]
            }')

          curl -sS -f -X POST \
            -H "Authorization: Bearer $ACCESS_JWT" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg repo "$DID" --argjson record "$RECORD" '{repo:$repo, collection:"app.bsky.feed.post", record:$record}')" \
            "https://bsky.social/xrpc/com.atproto.repo.createRecord"
