name: Roadmap to Discord

# Mirrors the public GitHub roadmap (project 1) into the Discord channel
# #🗺️-roadmap. Edits two existing webhook messages (DE, EN) and never posts new
# ones - so no notifications on every run. Changes to a user project don't
# trigger workflows, hence daily, after every release and manually.

on:
  schedule:
    - cron: "17 5 * * *"
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync roadmap
        env:
          # A separate read-only token (read:project), in case the default token can't read the user project.
          GH_TOKEN: ${{ secrets.ROADMAP_READ_TOKEN || github.token }}
          DISCORD_ROADMAP_WEBHOOK: ${{ secrets.DISCORD_ROADMAP_WEBHOOK }}
          DISCORD_ROADMAP_MSG_DE: ${{ vars.DISCORD_ROADMAP_MSG_DE }}
          DISCORD_ROADMAP_MSG_EN: ${{ vars.DISCORD_ROADMAP_MSG_EN }}
        run: python3 .github/scripts/roadmap_discord.py
