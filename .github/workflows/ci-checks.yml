name: CI-Prüfungen (TypeScript, Tests, Clippy)

on:
  push:
    branches:
      - master
      - "release/**"
  pull_request: {}
  workflow_dispatch: {}

jobs:
  ci-checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust-Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            cmake

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript prüfen (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Frontend-Tests (vitest)
        run: npx vitest run

      # Frontend-Build wird gebraucht, weil tauri::generate_context!() beim
      # Rust-Build/-Test das dist-Verzeichnis (frontendDist) einbettet.
      - name: Frontend bauen (dist fuer tauri::generate_context)
        run: npm run build

      - name: Clippy (nur test code betroffen, -D warnings)
        working-directory: src-tauri
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      - name: Rust-Tests
        working-directory: src-tauri
        run: cargo test --no-default-features
