name: CI checks (TypeScript, tests, Clippy)

on:
  push:
    branches:
      - master
      - "release/**"
      - "dev/**"
  pull_request: {}
  workflow_dispatch: {}

# Least privilege: the jobs only read the repository (and the release via the read-only token).
permissions:
  contents: read

jobs:
  ci-checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> src-tauri/target

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            cmake

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check TypeScript (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Frontend tests (vitest)
        run: npx vitest run

      # The frontend build is needed because tauri::generate_context!() embeds the
      # dist directory (frontendDist) during the Rust build/test.
      - name: Build frontend (dist for tauri::generate_context)
        run: npm run build

      # The web target is a second build of the same sources (VITE_TARGET=web); a type or import
      # error that only shows up there must fail here, not in the Docker image build.
      - name: Build web frontend (VITE_TARGET=web)
        run: npm run build:web

      - name: Clippy (all targets, -D warnings)
        run: cargo clippy --workspace --no-default-features --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --no-default-features

      # The test guide generator writes the result sheet with openpyxl; Ubuntu's
      # package, because pip may not install into the system Python (PEP 668).
      - name: Release tool tests (unittest)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-openpyxl
          python3 -m unittest discover -s tools -p 'test_*.py'

  # The workspace builds on Linux in the job above. The desktop app also ships for Windows and
  # macOS, and the shared core has Linux-only parts behind cfg gates (the web server's file
  # operations). A call outside such a gate compiles on Linux and breaks the other systems only
  # in the release build; this job finds it on the pull request instead.
  desktop-compile:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> src-tauri/target
          key: desktop-compile-${{ matrix.os }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # tauri::generate_context!() embeds the dist directory during the Rust build.
      - name: Build frontend (dist for tauri::generate_context)
        run: npm run build

      # tauri.windows.conf.json lists vc-runtime/*.dll as resources, so the build script of the
      # desktop crate fails without them, even for a plain cargo check.
      - name: Stage the Visual C++ runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\src-tauri\scripts\stage-vc-runtime.ps1

      # The portable file layer first: when it fails, the rest of the core fails for the same reason.
      - name: Test the portable file operations of the core
        run: "cargo test -p katalog-core --no-default-features fs_portable::"

      # Whole core test suite and the desktop command tests (incl. golden scenarios) on the real
      # systems: file locks, path spelling and case folding differ from Linux.
      - name: Test the core (all modules)
        run: cargo test -p katalog-core --no-default-features

      # tauri-build embeds the application manifest (common controls 6, which the dialog
      # plugin needs) into the app binary only. The test executable of the library has none,
      # so Windows ends it with STATUS_ENTRYPOINT_NOT_FOUND before a single test runs. A
      # manifest file next to an executable is used when none is embedded.
      - name: Give the desktop test executable a manifest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test -p mf-katalog-manager --no-default-features --lib --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = @'
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <dependency>
              <dependentAssembly>
                <assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls" version="6.0.0.0" processorArchitecture="*" publicKeyToken="6595b64144ccf1df" language="*" />
              </dependentAssembly>
            </dependency>
          </assembly>
          '@
          $exes = @(Get-ChildItem -Path src-tauri/target/debug -Recurse -Filter 'mf_katalog_manager_lib-*.exe')
          if ($exes.Count -eq 0) { throw 'test executable of the desktop library not found' }
          foreach ($exe in $exes) {
            Set-Content -Path "$($exe.FullName).manifest" -Value $manifest -Encoding utf8
            Write-Host "manifest written next to $($exe.FullName)"
          }

      - name: Test the desktop commands and golden scenarios
        run: "cargo test -p mf-katalog-manager --no-default-features commands::"

      # Only the desktop crate and the core it depends on: the web server is Linux/Docker only.
      - name: Compile the desktop app (core included)
        run: cargo check -p mf-katalog-manager --no-default-features --all-targets
