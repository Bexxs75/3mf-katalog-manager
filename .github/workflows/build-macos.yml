name: Build macOS DMG

on:
  workflow_dispatch: {}

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Homebrew liefert OCCT nur fuer die jeweilige Host-Architektur. Bis ein
      # austauschbares Universal-OCCT-Paket existiert, bleibt STEP hier aus.
      - name: Build Tauri app (universal macOS binary, without STEP preview)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target universal-apple-darwin -- --no-default-features

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3mf-katalog-manager-macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
