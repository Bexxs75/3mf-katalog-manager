name: Build macOS DMG

on:
  workflow_dispatch: {}
  # Also called by release.yml, which builds every variant in one run.
  workflow_call: {}

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Homebrew only provides OCCT for the host architecture. Until a replaceable
      # universal OCCT package exists, STEP stays off here.
      - name: Build Tauri app (universal macOS binary, without STEP preview)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target universal-apple-darwin -- --no-default-features

      # The updater installs a .app.tar.gz on macOS, not the DMG. COPYFILE_DISABLE
      # keeps macOS tar from adding AppleDouble "._*" files, which would otherwise
      # end up inside the installed bundle.
      - name: Pack the universal app for the updater
        env:
          COPYFILE_DISABLE: "1"
        run: tar -czf "$RUNNER_TEMP/updater.app.tar.gz" -C "src-tauri/target/universal-apple-darwin/release/bundle/macos" "3MF Katalog Manager.app"

      - name: Upload updater archive
        uses: actions/upload-artifact@v4
        with:
          name: 3mf-katalog-manager-macos-updater
          path: ${{ runner.temp }}/updater.app.tar.gz
          if-no-files-found: error

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3mf-katalog-manager-macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
